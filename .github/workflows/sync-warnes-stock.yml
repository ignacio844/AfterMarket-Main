name: Sync WARNES Stock

on:
  workflow_dispatch:

  schedule:
    # 07:00 Argentina (UTC-3) = 10:00 UTC
    - cron: "0 10 * * *"

jobs:
  sync-warnes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: workers/wms-stock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: workers/wms-stock/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Sync WARNES stock to Supabase
        env:
          WMS_BASE_URL: ${{ secrets.WMS_BASE_URL }}
          WMS_USERNAME: ${{ secrets.WMS_USERNAME }}
          WMS_PASSWORD: ${{ secrets.WMS_PASSWORD }}

          WMS_BROWSER_CHANNEL: ""

          WMS_DOWNLOAD_DIR: entrada
          WMS_MIN_SKUS: "4000"
          WMS_MAX_SKU_DELTA: "0.25"
          WMS_MAX_STOCK_DELTA: "0.30"

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SCHEMA: portal_aftermarket

        run: |
          python wms_stock_sync.py
